name: Cross version tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gradle-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        gradleVersion: ["6.8.3", "6.9.4", "7.0.2", "8.0.2", "8.11.1", "8.14.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
      - uses: testlens-app/setup-testlens@89edf53f781ac41833b4bc74d0e19a5315c79c67 # v1.10.0
      - run: "./gradlew test${{ matrix.gradleVersion }}"
